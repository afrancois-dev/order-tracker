apiVersion: 1

groups:
  - orgId: 1
    name: order-tracker
    folder: Order Tracker
    interval: 10s
    rules:
      - uid: order-tracker-5xx
        title: Order Tracker 5xx responses
        condition: C
        for: 0s
        noDataState: OK
        execErrState: OK
        annotations:
          summary: "Order Tracker returned 5xx errors on {{ $labels.http_route }}"
          description: "Endpoint {{ $labels.http_route }} returned HTTP {{ $labels.http_status_code }} responses in the last 1m."
          endpoint: "{{ $labels.http_route }}"
          dashboard_url: "http://localhost:3000/d/order-tracker"
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: sum by (http_route, http_status_code) (increase(http_server_requests_total{http_status_code=~"5.."}[1m]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                  type: query
              expression: A
              refId: C
              type: threshold
